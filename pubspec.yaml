name: readmesh
description: "A peer-to-peer collaborative PDF reading application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  crypto: ^3.0.5
  uuid: ^4.5.1
  get_it: ^8.0.2
  pdfx: ^2.8.0
  flutter_svg: ^2.0.10+1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.24.2

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
